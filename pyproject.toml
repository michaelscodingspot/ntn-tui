[project]
name = "notion-tui"
version = "0.1.0"
description = "Terminal UI for Notion, built on the ntn CLI: page list, search, Markdown preview, edit in $EDITOR"
authors = [
    { name = "Michael Shpilt", email = "contact@obics.io" }
]
requires-python = ">=3.13"
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
notion-tui = "notion_tui:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
